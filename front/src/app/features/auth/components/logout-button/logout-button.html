<button
  pButton
  type="button"
  class="h-fit py-2.5 px-3"
  title="Déconnexion"
  aria-label="Déconnexion"
  size="small"
  severity="danger"
  text
  rounded
  [disabled]="running()"
  (click)="onLogout()"
>
  @if (running()) {
    <quizz-icon name="cog" animation="spin" size="lg" pButtonIcon />
  } @else {
    <quizz-icon name="sign-out" size="lg" pButtonIcon />
  }
</button>
