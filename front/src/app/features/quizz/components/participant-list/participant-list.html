<div
  class="bg-surface-0/95 dark:bg-surface-900/95 border-surface-200 dark:border-surface-800 relative max-h-80 w-full max-w-lg overflow-y-auto rounded-3xl border p-5 shadow-xl backdrop-blur-xl"
>
  <div class="sticky top-0 z-10 flex items-center justify-between border-b border-surface-200 dark:border-surface-800 pb-3 bg-surface-0/95 dark:bg-surface-900/95">
    <h2 class="text-base font-black text-slate-800 dark:text-slate-100 flex items-center gap-2">
      <span>👥 Participants dans la salle</span>
    </h2>
    <span class="px-3 py-1 rounded-full text-xs font-black bg-indigo-100 dark:bg-indigo-900/70 text-indigo-700 dark:text-indigo-300">
      {{ participants().length }} en ligne
    </span>
  </div>

  <ul class="flex flex-wrap gap-2.5 pt-4">
    @for (participant of participants(); track participant.nickname) {
      <li class="flex items-center gap-2 rounded-xl bg-surface-100 dark:bg-surface-800/80 px-3 py-2 border border-surface-200 dark:border-surface-700/60 shadow-sm transition-all hover:scale-105">
        <quizz-participant-icon
          class="inline-block w-6 h-6"
          backgroundColor="var(--p-surface-300)"
          leafColor="green"
        />
        <span class="text-sm font-bold text-slate-800 dark:text-slate-100">{{ participant.nickname }}</span>
      </li>
    } @empty {
      <li class="w-full text-center py-6 text-sm text-slate-400 italic">
        En attente des premiers joueurs...
      </li>
    }
  </ul>
</div>
