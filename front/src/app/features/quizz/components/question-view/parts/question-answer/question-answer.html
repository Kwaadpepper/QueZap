<label
  class="answer-option relative flex h-full min-h-20 w-full items-center p-3.5 sm:p-4 rounded-2xl border-3 cursor-pointer shadow-md select-none overflow-hidden"
  [class]="`answer-option-${currentFormIndex()}`"
>
  <input
    class="checkbox"
    [type]="radio() ? 'radio' : 'checkbox'"
    [attr.name]="'question-' + questionId()"
    [attr.aria-label]="accessibleLabel()"
    [checked]="field()().value()"
  />
  <div class="relative z-10 flex w-full items-center gap-3 sm:gap-4">
    <!-- Geometric icon container with high-contrast badge & number (Triple-coding: Number + Shape + Color) -->
    <div class="flex h-12 min-w-16 sm:h-14 sm:min-w-20 shrink-0 items-center justify-center gap-1.5 px-2 rounded-xl bg-black/25 backdrop-blur-sm shadow-inner transition-transform duration-200">
      <span class="text-base sm:text-lg font-black text-white/90 font-mono" aria-hidden="true">{{ identifier() + 1 }}</span>
      <quizz-question-icon
        class="w-6 h-6 sm:w-7 sm:h-7"
        aria-hidden="true"
        [form]="currentForm()"
        [checked]="field()().value()"
      />
    </div>

    <!-- Answer text & picture -->
    <div class="flex flex-1 flex-col justify-center min-w-0">
      <span class="answer-phrase font-bold text-lg sm:text-xl md:text-2xl leading-tight line-clamp-3">
        {{ phrase() }}
      </span>

      @let picture = pictureUrl();
      @if (picture) {
        <div class="mt-2 overflow-hidden rounded-lg">
          <quizz-picture
            [aria-labelledby]="`answer-image-desc-${identifier()}`"
            [pictureUrl]="picture"
          />
          <span class="sr-only" [id]="`answer-image-desc-${identifier()}`">
            Image de la réponse {{ identifier() + 1 }}
          </span>
        </div>
      }
    </div>

    <!-- Checked selection indicator badge -->
    @if (field()().value()) {
      <div class="flex h-8 w-8 sm:h-9 sm:w-9 shrink-0 items-center justify-center rounded-full bg-white text-slate-900 shadow-lg">
        <i class="pi pi-check text-base font-black text-emerald-600"></i>
      </div>
    }
  </div>
</label>
