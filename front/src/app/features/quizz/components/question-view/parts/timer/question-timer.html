<div
  class="relative flex h-20 w-20 items-center justify-center rounded-full bg-slate-900/90 shadow-2xl backdrop-blur-md transition-all duration-300 border-2"
  [class.border-red-500]="isUrgent()"
  [class.animate-pulse]="isUrgent()"
  [class.scale-110]="isUrgent()"
  [class.border-indigo-500]="!isUrgent() && remainingSeconds() > 5"
  [class.border-slate-700]="remainingSeconds() === 0"
  [class.hidden]="timer() === undefined"
  [title]="`${remainingSeconds()} secondes restantes`"
>
  <!-- Circular SVG Gauge -->
  <svg class="absolute inset-0 h-full w-full -rotate-90 p-1" viewBox="0 0 64 64">
    <!-- Track -->
    <circle
      cx="32"
      cy="32"
      r="26"
      class="text-slate-800/80"
      stroke-width="5"
      stroke="currentColor"
      fill="transparent"
    />
    <!-- Progress Bar -->
    <circle
      cx="32"
      cy="32"
      r="26"
      stroke-width="5"
      stroke-linecap="round"
      fill="transparent"
      class="transition-all duration-1000 ease-linear"
      [attr.stroke-dasharray]="circumference"
      [attr.stroke-dashoffset]="strokeDashoffset()"
      [attr.stroke]="strokeColor()"
    />
  </svg>

  <!-- Digits -->
  <div class="relative z-10 flex flex-col items-center justify-center">
    <span
      class="font-mono text-2xl font-black leading-none select-none"
      [class.text-red-400]="isUrgent()"
      [class.text-amber-400]="!isUrgent() && remainingSeconds() <= 15"
      [class.text-white]="remainingSeconds() > 15"
    >
      {{ remainingSeconds() }}
    </span>
    <span class="text-[9px] font-bold uppercase tracking-widest text-slate-400 select-none">sec</span>
  </div>
</div>
