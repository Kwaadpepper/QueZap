@if (showTimerWarning()) {
  <div
    role="status"
    aria-live="polite"
    class="my-1.5 flex items-center gap-2 rounded-full bg-amber-500/90 text-slate-950 px-3.5 py-1 shadow-lg font-bold text-xs sm:text-sm whitespace-nowrap"
  >
    <span class="text-base select-none" aria-hidden="true">⏱️</span>
    <span>Plus que <strong class="font-mono font-black">{{ timeLeft() }}s</strong></span>
  </div>
}
@if (timesUp()) {
  <div
    role="alert"
    aria-live="assertive"
    class="my-1.5 flex items-center gap-2 rounded-full bg-rose-600 text-white px-3.5 py-1 shadow-lg font-bold text-xs sm:text-sm whitespace-nowrap"
  >
    <span class="text-base select-none" aria-hidden="true">🔒</span>
    <span>Temps écoulé — Réponses verrouillées</span>
  </div>
}
