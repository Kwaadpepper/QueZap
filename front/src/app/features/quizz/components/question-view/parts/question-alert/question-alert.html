@if (showTimerWarning()) {
  <div
    role="status"
    aria-live="polite"
    class="my-2 flex items-center gap-3 rounded-2xl bg-amber-500/20 border border-amber-500/60 px-4 py-2 shadow-lg backdrop-blur-md transition-all motion-safe:animate-bounce"
  >
    <span class="text-2xl select-none" aria-hidden="true">⏱️</span>
    <div class="select-none">
      <strong class="text-sm font-black text-amber-900 dark:text-amber-300">Dépêchez-vous !</strong>
      @if (timeLeft()) {
        <div class="text-xs text-amber-800 dark:text-amber-200">
          Il ne reste que <span class="font-mono font-bold text-sm">{{ timeLeft() }}s</span> pour valider.
        </div>
      }
    </div>
  </div>
}
@if (timesUp()) {
  <div
    role="alert"
    aria-live="assertive"
    class="my-2 flex items-center gap-3 rounded-2xl bg-red-500/20 border border-red-500/60 px-4 py-2 shadow-lg backdrop-blur-md transition-all"
  >
    <span class="text-2xl select-none" aria-hidden="true">⏰</span>
    <div class="select-none">
      <strong class="text-sm font-black text-red-900 dark:text-red-300">Temps écoulé !</strong>
      <div class="text-xs text-red-800 dark:text-red-200">
        Vos réponses sont enregistrées et verrouillées.
      </div>
    </div>
  </div>
}
