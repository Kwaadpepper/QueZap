<div class="flex w-full flex-1 flex-col items-center justify-between gap-2 px-2 py-1 sm:gap-3 sm:px-4">
  <!-- QUESTION TITLE & ALERT -->
  <header class="flex w-full flex-col items-center gap-1.5 sm:gap-2">
    <div class="question-background w-full rounded px-4 py-2 shadow-md md:w-fit sm:py-2.5">
      <h1 class="question-phrase">
        {{ phrase() }}
      </h1>
    </div>

    @let secondsLeft = timeLeft();
    @if (secondsLeft !== undefined && !isRevealing()) {
      <quizz-question-alert [timeLeft]="secondsLeft" [isRevealing]="isRevealing()" />
    }
  </header>

  <!-- CONTENT FRAME -->
  <div class="relative mx-auto flex w-full max-w-2xl grow flex-col justify-center gap-3 rounded-2xl border-0 p-1.5 sm:gap-4 sm:p-4">
    <!-- QUESTION ELEMENTS -->
    @let pictureUrl = picture();
    @if (pictureUrl !== undefined) {
      <div class="flex w-full flex-col items-center justify-center px-2 sm:px-5">
        <div class="question-background flex w-fit flex-col rounded-xl p-1.5 shadow-md sm:p-2">
          <quizz-picture aria-labelledby="question-image-desc" [pictureUrl]="pictureUrl" />
          <span id="question-image-desc" class="sr-only">
            Image de la question
          </span>
        </div>
      </div>
    }

    <!-- CASH FREE-FORM INPUT FORM -->
    <form
      class="flex w-full flex-col gap-4 transition-opacity duration-300"
      [class.opacity-60]="cannotAnswerAnymore()"
      [inert]="cannotAnswerAnymore()"
      (submit)="submitAnswer(); $event.preventDefault()"
    >
      <div class="flex flex-col gap-2">
        <label for="cash-input" class="flex items-center gap-2 text-sm font-bold tracking-wide text-slate-200 uppercase">
          <span>✍️</span>
          <span>Votre réponse</span>
        </label>
        <div class="relative flex items-center">
          <input
            id="cash-input"
            name="cashInput"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Tape ta réponse ici..."
            class="w-full rounded-2xl border-2 bg-slate-900/90 px-4 py-3.5 text-lg font-bold text-white placeholder-slate-500 shadow-xl transition-all outline-none sm:py-4 sm:text-xl"
            [class.border-slate-700]="cannotAnswerAnymore()"
            [class.opacity-60]="cannotAnswerAnymore()"
            [class.cursor-not-allowed]="cannotAnswerAnymore()"
            [class.border-amber-500/80]="!cannotAnswerAnymore()"
            [class.focus:border-amber-400]="!cannotAnswerAnymore()"
            [class.focus:ring-4]="!cannotAnswerAnymore()"
            [class.focus:ring-amber-500/20]="!cannotAnswerAnymore()"
            [value]="textInput()"
            [disabled]="cannotAnswerAnymore()"
            (input)="onTextInput($event)"
          />
        </div>
      </div>

      <button
        type="submit"
        class="flex w-full items-center justify-center gap-2 rounded-2xl px-6 py-3.5 text-base font-black tracking-wider uppercase shadow-xl transition-all active:scale-[0.98] sm:py-4 sm:text-lg"
        [class.bg-slate-700]="cannotAnswerAnymore() || !textInput().trim() || isSubmitting()"
        [class.text-slate-400]="cannotAnswerAnymore() || !textInput().trim() || isSubmitting()"
        [class.opacity-60]="cannotAnswerAnymore() || !textInput().trim() || isSubmitting()"
        [class.cursor-not-allowed]="cannotAnswerAnymore() || !textInput().trim() || isSubmitting()"
        [class.bg-gradient-to-r]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.from-amber-400]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.to-amber-500]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.text-slate-950]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.hover:from-amber-300]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.hover:to-amber-400]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.cursor-pointer]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.shadow-amber-500/25]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [class.hover:shadow-amber-500/40]="!(cannotAnswerAnymore() || !textInput().trim() || isSubmitting())"
        [disabled]="cannotAnswerAnymore() || !textInput().trim() || isSubmitting()"
      >
        <span>{{ hasSubmitted() ? 'Mettre à jour la réponse' : 'Valider ma réponse' }}</span>
        <i class="pi pi-send"></i>
      </button>
    </form>

    <!-- SUBMISSION STATUS -->
    <quizz-submission-feedback
      hintMessage="Modifiable"
      [error]="submissionError()"
      [isSubmitting]="isSubmitting()"
      [hasSubmitted]="hasSubmitted()"
      [submittedMessage]="submittedLabel()"
    />
  </div>
</div>
