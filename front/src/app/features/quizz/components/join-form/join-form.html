<form
  class="bg-surface-0/95 dark:bg-surface-900/95 border-surface-200 dark:border-surface-800 rounded-3xl border p-6 sm:p-8 shadow-2xl backdrop-blur-xl"
  (submit)="onSubmitJoinForm(); $event.preventDefault()"
>
  <div class="mb-5 text-center">
    <h2 class="text-2xl font-black text-slate-900 dark:text-white">Code PIN de session</h2>
    <p class="text-surface-600 dark:text-surface-400 mt-1 text-sm">
      Entre le code PIN affiché sur l'écran de projection
    </p>
  </div>

  <div class="flex flex-col gap-4" aria-labelledby="join-label" aria-describedby="join-help">
    <div class="relative">
      <input
        pInputText
        id="join-code"
        type="tel"
        inputmode="numeric"
        placeholder="20082"
        class="w-full py-4 text-center text-3xl sm:text-4xl font-mono font-black tracking-[0.3em] uppercase rounded-2xl border-2 border-indigo-300 dark:border-indigo-700/80 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 transition-all shadow-inner"
        autocomplete="off"
        spellcheck="false"
        aria-describedby="join-help"
        quizzFieldError
        [fieldState]="joinCodeForm.code"
        [formField]="joinCodeForm.code"
      />
    </div>

    <p id="join-help" class="text-surface-500 dark:text-surface-400 text-center text-xs">
      Exemple : <strong class="font-mono text-indigo-500 font-semibold">20082</strong>
    </p>

    <div class="mt-2 flex flex-col sm:flex-row items-center gap-3">
      @if (isDebug()) {
        <p-button
          type="button"
          class="w-full sm:w-auto"
          title="Utiliser un code de test"
          severity="info"
          outlined
          (onClick)="onFillMockedValue()"
        >
          <quizz-icon name="debug" pButtonIcon />
        </p-button>
      }
      <p-button
        label="Rejoindre le Quizz"
        type="submit"
        severity="primary"
        styleClass="w-full py-3.5 text-lg font-black rounded-xl shadow-lg transition-transform active:scale-98"
        aria-label="Rejoindre la partie"
        [disabled]="joinCodeForm().invalid()"
      />
    </div>

    <div class="mt-2 flex items-center justify-center gap-2 text-surface-500 dark:text-surface-400 text-xs text-center border-t border-surface-200 dark:border-surface-800/80 pt-4">
      <i class="pi pi-qrcode text-indigo-400 text-base"></i>
      <span>Tu peux aussi scanner le QR Code projeté par l'enseignant.</span>
    </div>
  </div>
</form>
