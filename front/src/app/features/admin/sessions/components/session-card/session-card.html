<p-card styleClass="h-full border border-surface-200 dark:border-surface-700/80 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200 w-full" [style]="{ '--p-card-body-padding': '1.25rem' }">
  <div class="flex flex-col gap-3">
    <!-- Header with status badge & Code -->
    <div class="flex items-center justify-between">
      @if (isLive()) {
        <span class="flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          En direct
        </span>
      } @else if (isEnded()) {
        <span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border border-slate-300 dark:border-slate-700">
          Terminée
        </span>
      } @else {
        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 dark:bg-indigo-950/80 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800">
          En attente
        </span>
      }

      @if (session().code) {
        <span class="font-mono text-xs font-bold tracking-widest px-2.5 py-0.5 rounded-lg bg-surface-100 dark:bg-surface-800 text-slate-700 dark:text-slate-300 border border-surface-200 dark:border-surface-700">
          {{ session().code }}
        </span>
      }
    </div>

    <!-- Title -->
    <div>
      <h3 class="session-title text-base sm:text-lg font-bold text-slate-900 dark:text-white line-clamp-2 min-h-[3rem] leading-snug">
        {{ session().name }}
      </h3>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-between gap-2 pt-2 border-t border-surface-100 dark:border-surface-800">
      <div class="flex items-center gap-2 flex-wrap">
        <p-button
          label="Projeter"
          icon="pi pi-external-link"
          size="small"
          severity="primary"
          title="Lancer la vue vidéoprojecteur (nouvel onglet)"
          [ariaLabel]="'Projeter la session ' + session().name + ' sur grand écran'"
          (onClick)="onSessionPresent()"
        />

        @if (isEnded()) {
          <p-button
            label="Bilan"
            icon="pi pi-chart-bar"
            size="small"
            severity="success"
            title="Consulter le bilan complet de la session"
            [ariaLabel]="'Consulter le bilan de la session ' + session().name"
            (onClick)="onSessionReport()"
          />
        }
      </div>

      <p-button
        icon="pi pi-pencil"
        size="small"
        severity="secondary"
        text
        rounded
        title="Modifier la session"
        [ariaLabel]="'Modifier la session ' + session().name"
        (onClick)="onSessionEdit()"
      />
    </div>
  </div>
</p-card>
