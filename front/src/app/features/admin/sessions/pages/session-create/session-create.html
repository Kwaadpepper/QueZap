<div class="my-6 flex items-center justify-center">
  <h1 class="text-3xl font-bold">Création de session</h1>
</div>

<div class="flex justify-center">
  <form class="flex flex-col gap-6 w-full max-w-lg bg-surface-100 dark:bg-surface-900 p-8 rounded-xl border border-surface-300 dark:border-surface-700 shadow" (submit)="onSave(); $event.preventDefault()">
    <div class="flex flex-col gap-2">
      <label for="name" class="font-semibold">Nom de la session</label>
      <input pInputText id="name" name="name" type="text" [ngModel]="model().name" (ngModelChange)="updateName($event)" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="quezapId" class="font-semibold">Quezap associé</label>
      <p-select optionLabel="title" optionValue="id" optionDisabled="disabled" name="quezapId" placeholder="Sélectionnez un Quezap" [options]="quezapOptions()" [ngModel]="model().quezapId" (ngModelChange)="updateQuezapId($event)" />
    </div>

    <div class="flex justify-end gap-3 mt-4">
      <p-button label="Annuler" severity="secondary" routerLink="/admin/sessions"></p-button>
      <p-button label="Créer la session" type="submit" [disabled]="sessionForm().invalid() || sessionForm().submitting()"></p-button>
    </div>
  </form>
</div>
