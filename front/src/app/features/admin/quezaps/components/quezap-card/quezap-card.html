<p-card styleClass="border border-surface-200 dark:border-surface-700/80 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200 w-full sm:w-80" [style]="{ '--p-card-body-padding': '1.25rem' }">
  <div class="flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <p-chip class="theme-chip text-xs">
        <quizz-icon name="theme" />
        <span class="font-bold">{{ quezap().theme.name }}</span>
      </p-chip>
    </div>

    <h3 class="theme-title text-lg font-bold text-slate-900 dark:text-white line-clamp-2 min-h-12">
      {{ quezap().title }}
    </h3>

    @if (quezap().description) {
      <p class="text-xs text-surface-500 dark:text-surface-400 line-clamp-2">
        {{ quezap().description }}
      </p>
    }

    <div class="flex items-center justify-between gap-2 pt-2 border-t border-surface-100 dark:border-surface-800">
      <p-button
        label="Lancer"
        size="small"
        severity="primary"
        title="Lancer une session en direct (nouvel onglet)"
        [disabled]="launchingSession()"
        (onClick)="onQuezapLaunch()"
      >
        <span pButtonIcon class="text-xs">🚀</span>
      </p-button>

      <div class="flex items-center gap-1.5">
        @if (editable()) {
          <p-button
            size="small"
            severity="secondary"
            text
            title="Dupliquer ce quezap"
            (onClick)="onQuezapDuplicate()"
          >
            <quizz-icon name="copy" pButtonIcon />
          </p-button>
          <p-button
            size="small"
            severity="secondary"
            text
            title="Modifier ce quezap"
            (onClick)="onQuezapEdit()"
          >
            <quizz-icon name="pencil" pButtonIcon />
          </p-button>
        }
      </div>
    </div>
  </div>
</p-card>
