<p-card styleClass="h-full border border-surface-200 dark:border-surface-700/80 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200 w-full" [style]="{ '--p-card-body-padding': '1.25rem' }">
  <div class="flex flex-col gap-3">
    <div class="flex items-center justify-between">
      <p-chip class="theme-chip text-xs">
        <quizz-icon name="theme" />
        <span class="font-bold">{{ quezap().theme.name }}</span>
      </p-chip>
    </div>

    <h3 class="theme-title text-base sm:text-lg font-bold text-slate-900 dark:text-white line-clamp-2 min-h-[3.25rem] flex items-center">
      {{ quezap().title }}
    </h3>

    @if (quezap().description) {
      <p class="text-xs text-surface-500 dark:text-surface-400 line-clamp-2 min-h-8">
        {{ quezap().description }}
      </p>
    } @else {
      <div class="min-h-8"></div>
    }

    <div class="flex items-center justify-between gap-2 pt-2 border-t border-surface-100 dark:border-surface-800">
      <p-button
        label="Lancer"
        icon="pi pi-play"
        size="small"
        severity="primary"
        title="Lancer une session en direct (nouvel onglet)"
        [ariaLabel]="'Lancer une session en direct pour le quiz ' + quezap().title"
        [disabled]="launchingSession()"
        (onClick)="onQuezapLaunch()"
      />

      <div class="flex items-center gap-1.5">
        @if (editable()) {
          <p-button
            icon="pi pi-copy"
            size="small"
            severity="secondary"
            text
            rounded
            title="Dupliquer ce quiz"
            [ariaLabel]="'Dupliquer le quiz ' + quezap().title"
            (onClick)="onQuezapDuplicate()"
          />
          @if (canEdit()) {
            <p-button
              icon="pi pi-pencil"
              size="small"
              severity="secondary"
              text
              rounded
              title="Modifier ce quiz"
              [ariaLabel]="'Modifier le quiz ' + quezap().title"
              (onClick)="onQuezapEdit()"
            />
            <p-button
              icon="pi pi-trash"
              size="small"
              severity="danger"
              text
              rounded
              title="Supprimer ce quiz"
              [ariaLabel]="'Supprimer le quiz ' + quezap().title"
              (onClick)="onQuezapDelete($event)"
            />
          }
        }
      </div>
    </div>
  </div>
</p-card>

<p-confirmpopup
  #confirmDeleteQuezap
  [pt]="{ root: { 'aria-label': 'Confirmez vouloir supprimer le quiz', tabindex: 0 } }"
>
  <ng-template #headless let-message>
    <div class="rounded-xl p-4 max-w-xs">
      <p class="font-bold text-slate-900 dark:text-white text-sm">Supprimer ce quiz ?</p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{ message.message }}</p>
      <div class="mt-4 flex items-center justify-end gap-2">
        <p-button
          label="Annuler"
          size="small"
          severity="secondary"
          text
          (onClick)="confirmDeleteQuezap.onReject()"
        />
        <p-button
          label="Supprimer"
          size="small"
          severity="danger"
          (onClick)="confirmDeleteQuezap.onAccept()"
        />
      </div>
    </div>
  </ng-template>
</p-confirmpopup>
