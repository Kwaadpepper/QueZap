<div class="answer-option relative flex h-full w-full items-center rounded-2xl border-2 p-3 transition-all" [class]="`answer-option-${currentFormIndex()}`">
  <div class="flex w-full items-center gap-3">
    <quizz-question-icon class="shrink-0" [form]="currentForm()" [checked]="true" />

    <quizz-phrase-input
      class="flex-1 min-w-0"
      [index]="index()"
      [phrase]="phrase()"
      [readonly]="readonly()"
      (phraseChanged)="onPhraseChanged($event)"
    />

    <div class="flex items-center gap-2 shrink-0">
      @if (answer().picture) {
        <div class="relative inline-block">
          <img alt="Answer Image" class="max-h-12 max-w-full rounded-md object-contain" [src]="answer().picture" />
          <button type="button" class="absolute -top-1 -right-1 bg-red-500 hover:bg-red-600 text-white rounded-full p-1 w-5 h-5 flex items-center justify-center text-xs shadow focus:outline-hidden focus:ring-2 focus:ring-red-400" title="Supprimer l'image" aria-label="Supprimer l'image de la réponse" (click)="removePicture()">
            <i class="pi pi-times"></i>
          </button>
        </div>
      } @else {
        <p-fileUpload
          mode="basic"
          chooseIcon="pi pi-image"
          chooseLabel=" "
          accept="image/*"
          maxFileSize="5000000"
          [auto]="true"
          [customUpload]="true"
          (onSelect)="onUpload($event)"
        />
      }

      <div class="flex items-center pl-2 border-l border-slate-300/50 dark:border-slate-700/50" title="Marquer comme bonne réponse">
        <quizz-answer-correctness
          [checked]="isCorrect()"
          (correctnessChanged)="onCorrectnessChanged($event)"
        />
      </div>

      @if (canDelete()) {
        <button
          type="button"
          class="flex items-center justify-center w-8 h-8 rounded-full text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors focus:outline-hidden"
          title="Supprimer cette réponse"
          aria-label="Supprimer cette réponse"
          (click)="deleteAnswer.emit(index())"
        >
          <i class="pi pi-trash text-sm"></i>
        </button>
      }
    </div>
  </div>
</div>
