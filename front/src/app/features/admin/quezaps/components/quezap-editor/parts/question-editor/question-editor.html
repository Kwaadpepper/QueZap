<div class="flex h-full min-h-0 w-full flex-col justify-between overflow-y-auto lg:flex-row lg:overflow-hidden">
  <!-- QUESTION EDITOR -->
  <main class="quezap-theme-background relative flex min-h-0 grow flex-col gap-4 overflow-y-auto p-4 transition-colors duration-300">
    <quizz-phrase-editor class="w-full" />

    <div class="grow flex flex-col items-center justify-center">
      @if (isUploading()) {
        <div class="flex flex-col items-center justify-center gap-2 p-6 rounded-2xl bg-slate-100/50 dark:bg-slate-800/50 border border-slate-300 dark:border-slate-700">
          <i class="pi pi-spin pi-spinner text-3xl text-indigo-500"></i>
          <span class="text-sm font-medium text-slate-600 dark:text-slate-300">Téléversement de l'image en cours...</span>
        </div>
      } @else if (question().picture) {
        <div class="relative inline-block max-w-full">
          <img alt="Question Image" class="max-h-80 max-w-full rounded-2xl object-contain shadow-2xl transition-all duration-300" [src]="question().picture" />
          <button type="button" class="absolute top-2 right-2 bg-red-500 hover:bg-red-600 text-white rounded-full p-2 shadow-lg focus:outline-hidden focus:ring-2 focus:ring-red-400 cursor-pointer" title="Supprimer l'image" aria-label="Supprimer l'image de la question" (click)="removePicture()">
            <i class="pi pi-times"></i>
          </button>
        </div>
      } @else {
        <p-fileUpload
          mode="basic"
          chooseLabel="Ajouter une image"
          accept="image/jpeg,image/png,image/webp"
          [maxFileSize]="5242880"
          [auto]="true"
          [customUpload]="true"
          (onSelect)="onUpload($event)"
        />
      }
    </div>

    <quizz-answer-editor />

    <quizz-question-timer class="pointer-events-none absolute right-5 bottom-5 z-10" />
  </main>

  <!-- RIGHT SIDE PANEL -->
  <div class="question-details flex w-full shrink-0 flex-col p-3 lg:h-full lg:w-72 lg:min-w-64 lg:overflow-y-auto">
    <div>
      <span class="font-bold text-base">Détails</span>
    </div>
    <div class="grow">
      <quizz-type-selector class="my-4 block" />
      <p-divider />

      @if (themes().length > 0) {
        <div class="my-4 flex flex-col gap-2">
          <span id="question-theme-label" class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Thème</span>
          <p-select
            class="w-full"
            ariaLabelledBy="question-theme-label"
            optionLabel="name"
            optionValue="id"
            placeholder="Général (par défaut)"
            [options]="themes()"
            [showClear]="true"
            [ngModel]="question().themeId ?? null"
            (ngModelChange)="onThemeChange($event)"
          />
        </div>
        <p-divider />
      }

      <quizz-limit-selector class="my-4 block" />
      <p-divider />
      <quizz-points-selector class="my-4 block" />
    </div>
    <p-divider />
    <quizz-panel-question-actions />
  </div>
</div>
