<textarea
  #textarea
  pTextarea
  fluid
  class="phrase-input-textarea answer-phrase resize-none"
  maxlength="75"
  rows="2"
  cols="30"
  ondragstart="return false;"
  [placeholder]="`Ajouter réponse ${index() + 1}`"
  [value]="phrase()"
  [disabled]="readonly()"
  (input)="onPhraseChanged(textarea.value)"
></textarea>
