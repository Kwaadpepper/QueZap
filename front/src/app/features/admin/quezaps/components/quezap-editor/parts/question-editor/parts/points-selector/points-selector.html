<div class="flex flex-col gap-2">
  <span class="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider" [id]="selectId">🏆 Barème de points</span>

  <div class="grid grid-cols-3 gap-1.5" role="radiogroup" [attr.aria-labelledby]="selectId">
    @for (opt of pointOptions; track opt.value) {
      <button
        type="button"
        role="radio"
        class="px-2 py-2 text-xs rounded-xl font-bold border transition cursor-pointer text-center"
        [attr.aria-checked]="selectedPoints() === opt.value"
        [title]="opt.label"
        [class]="selectedPoints() === opt.value ? 'bg-amber-600 text-white border-amber-500 shadow-sm' : 'bg-surface-100 dark:bg-surface-800 text-slate-700 dark:text-slate-300 border-surface-200 dark:border-surface-700 hover:bg-surface-200 dark:hover:bg-surface-700'"
        (click)="setQuickPoints(opt.value)"
      >
        {{ opt.quickLabel }}
      </button>
    }
  </div>
</div>
