<div class="flex flex-col gap-2">
  <span class="text-xs font-bold text-slate-500 uppercase tracking-wider" [id]="selectId">🏆 Barème de points</span>

  <div class="flex flex-wrap gap-1.5 mb-1">
    @for (opt of pointOptions; track opt.value) {
      <button
        type="button"
        class="px-2.5 py-1 text-xs rounded-lg font-bold border transition cursor-pointer"
        [class]="selectedPoints() === opt.value ? 'bg-amber-600 text-white border-amber-600 shadow-sm' : 'bg-surface-100 dark:bg-surface-800 text-slate-700 dark:text-slate-300 border-surface-200 dark:border-surface-700 hover:bg-surface-200 dark:hover:bg-surface-700'"
        (click)="setQuickPoints(opt.value)"
      >
        {{ opt.quickLabel }}
      </button>
    }
  </div>

  <p-select
    class="w-full"
    optionValue="value"
    optionLabel="label"
    [ariaLabelledBy]="selectId"
    [options]="pointOptions"
    (onChange)="onPointsChange($event)"
    [(ngModel)]="selectedPoints"
  />
</div>
