<div class="flex h-dvh flex-col overflow-hidden">
  <nav class="bg-surface-200 dark:bg-surface-800 flex flex-wrap items-center justify-between gap-2 px-3 py-2 border-b border-surface-300/70 dark:border-surface-700/70 drop-shadow-sm shrink-0">
    <quizz-title-editor class="min-w-0 flex-1 max-w-md" />

    <!-- Editorial buttons -->
    <menu class="flex flex-wrap items-center gap-2 m-0 p-0">
      <p-button
        outlined
        size="small"
        [label]="isPublic() ? 'Public' : 'Privé'"
        [icon]="isPublic() ? 'pi pi-globe' : 'pi pi-lock'"
        [severity]="isPublic() ? 'info' : 'secondary'"
        [title]="isPublic() ? 'Quiz public (cliquer pour passer en privé)' : 'Quiz privé (cliquer pour passer en public)'"
        [ariaLabel]="isPublic() ? 'Visibilité : Public' : 'Visibilité : Privé'"
        (onClick)="onToggleVisibility()"
      />

      <p-button
        label="Enregistrer"
        raised
        [severity]="isDirty() ? 'warn' : 'success'"
        [disabled]="persisting() || hasInvalidAnswers()"
        [title]="hasInvalidAnswers() ? 'Chaque question doit comporter au moins une bonne réponse' : ''"
        (onClick)="onSaveQuezap()"
      >
        @if (persisting()) {
          <quizz-icon name="cog" animation="spin" pButtonIcon />
        }
      </p-button>

      @if (savedQuezapId()) {
        <p-button
          label="Lancer en direct"
          raised
          severity="primary"
          title="Lancer la session en direct et ouvrir l'écran de projection"
          [disabled]="persisting() || hasInvalidAnswers() || launchingSession()"
          (onClick)="onLaunchSession()"
        >
          @if (launchingSession()) {
            <quizz-icon name="cog" animation="spin" pButtonIcon />
          } @else {
            <span pButtonIcon class="text-sm">🚀</span>
          }
        </p-button>
      }

      <p-button label="Fermer" raised severity="secondary" (onClick)="onCloseEditor()" />
    </menu>

    <!-- Confirmation dialog for unsaved changes -->
    <p-confirmdialog appendTo="body">
      <ng-template pTemplate="icon">
        <quizz-icon name="warn" severity="warn" />
      </ng-template>
    </p-confirmdialog>
  </nav>

  <div class="flex min-h-0 grow flex-col lg:flex-row overflow-hidden">
    <!-- Sidebar with questions list (horizontal filmstrip on <lg, vertical sidebar on lg+) -->
    <quizz-question-list-view class="w-full shrink-0 border-b border-surface-200 dark:border-surface-800 lg:h-full lg:w-64 xl:w-72 lg:border-b-0 lg:border-r" />

    <!-- Question editor -->
    <quizz-question-editor class="min-h-0 min-w-0 flex-1 overflow-hidden" />
  </div>
</div>
