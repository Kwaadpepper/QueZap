<div class="flex h-dvh flex-col overflow-hidden">
  <nav class="bg-surface-200 dark:bg-surface-800 flex flex-wrap items-center gap-2 p-2 drop-shadow-md">
    <quizz-title-editor class="mx-4" />

    <!-- Editorial buttons -->
    <menu class="ms-auto flex items-center gap-2">
      <p-button
        label="Enregistrer"
        raised
        [severity]="isDirty() ? 'warn' : 'success'"
        [disabled]="persisting() || hasInvalidAnswers()"
        [title]="hasInvalidAnswers() ? 'Chaque question doit comporter au moins une bonne réponse' : ''"
        (onClick)="onSaveQuezap()"
      >
        @if (persisting()) {
          <quizz-icon name="cog" animation="spin" pButtonIcon />
        }
      </p-button>

      @if (savedQuezapId()) {
        <p-button
          label="Lancer en direct"
          raised
          severity="primary"
          title="Lancer la session en direct et ouvrir l'écran de projection"
          [disabled]="persisting() || hasInvalidAnswers() || launchingSession()"
          (onClick)="onLaunchSession()"
        >
          @if (launchingSession()) {
            <quizz-icon name="cog" animation="spin" pButtonIcon />
          } @else {
            <span pButtonIcon class="text-sm">🚀</span>
          }
        </p-button>
      }

      <p-button label="Fermer" raised severity="secondary" (onClick)="onCloseEditor()" />
    </menu>

    <!-- Confirmation dialog for unsaved changes -->
    <p-confirmdialog appendTo="body">
      <ng-template pTemplate="icon">
        <quizz-icon name="warn" severity="warn" />
      </ng-template>
    </p-confirmdialog>
  </nav>

  <div class="flex min-h-0 grow flex-col md:flex-row overflow-hidden">
    <!-- Sidebar with questions list -->
    <quizz-question-list-view class="h-56 w-full shrink-0 md:h-full md:max-h-none md:w-72 md:min-w-64 lg:basis-1/5" />

    <!-- Question editor -->
    <quizz-question-editor class="min-h-0 min-w-0 w-full grow overflow-y-auto" />
  </div>
</div>
