<p-dialog
  appendTo="body"
  [modal]="true"
  [style]="{ width: '30rem', maxWidth: '92vw' }"
  (onShow)="onShow()"
  [(visible)]="visible"
>
  <ng-template #header>
    <div class="flex items-center gap-2">
      @if (forUpdateAction()) {
        <quizz-icon name="pencil" size="lg" />
        <span class="text-lg font-bold">Modifier le thème</span>
      } @else {
        <quizz-icon name="plus" size="lg" />
        <span class="text-lg font-bold">Créer un nouveau thème</span>
      }
    </div>
  </ng-template>

  @if (errorOccurred()) {
    <p-message severity="error" class="mb-4">
      <span> Une erreur est survenue. Veuillez réessayer. </span>
    </p-message>
  }
  <form
    class="flex flex-col gap-5 pt-1"
    [inert]="this.themeForm().submitting()"
    (submit)="onSave(); $event.preventDefault()"
  >
    <div class="flex flex-col gap-2">
      <label for="theme-name-input" class="text-sm font-semibold text-slate-700 dark:text-slate-200">
        Nom du thème
      </label>
      <input
        pInputText
        id="theme-name-input"
        class="w-full"
        placeholder="Ex: Culture générale, Sciences, Histoire..."
        autocomplete="off"
        type="text"
        quizzFieldError
        [formField]="themeForm.name"
        [fieldState]="themeForm.name"
      />
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <p-button label="Annuler" severity="secondary" text (onClick)="onCancel()" />
      <p-button
        label="Enregistrer"
        type="submit"
        [disabled]="this.themeForm().invalid() || this.themeForm().submitting()"
      >
        @if (this.themeForm().submitting()) {
          <quizz-icon name="cog" animation="spin" pButtonIcon />
        }
      </p-button>
    </div>
  </form>
</p-dialog>
