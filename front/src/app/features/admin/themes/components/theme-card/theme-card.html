<p-card styleClass="h-full border border-surface-200 dark:border-surface-700/80 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-0.5 transition-all duration-200" [style]="{ '--p-card-body-padding': '1rem' }">
  <div class="flex items-center justify-between gap-3">
    <div class="flex min-w-0 items-center gap-3">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 shadow-sm border border-indigo-200 dark:border-indigo-800">
        <quizz-icon name="theme" />
      </div>
      <span class="truncate text-base font-bold text-slate-900 dark:text-white" [title]="theme().name">{{ theme().name }}</span>
    </div>

    @if (editable()) {
      <div class="flex shrink-0 items-center gap-1">
        <p-button
          icon="pi pi-pencil"
          severity="secondary"
          text
          rounded
          title="Changer le nom du thème"
          size="small"
          class="shrink-0"
          [ariaLabel]="'Modifier le thème ' + theme().name"
          (onClick)="onOpenEditor()"
        />
        <p-button
          icon="pi pi-trash"
          severity="danger"
          text
          rounded
          title="Supprimer le thème"
          size="small"
          class="shrink-0"
          [ariaLabel]="'Supprimer le thème ' + theme().name"
          (onClick)="onDeleteTheme($event)"
        />
      </div>
      <quizz-theme-editor [theme]="theme()" [(visible)]="editorIsVisible" />
    }
  </div>
</p-card>

<p-confirmpopup
  #confirmDeleteTheme
  [pt]="{ root: { 'aria-label': 'Confirmez vouloir supprimer le thème', tabindex: 0 } }"
>
  <ng-template #headless let-message>
    <div class="rounded-xl p-4 max-w-xs">
      <p class="font-bold text-slate-900 dark:text-white text-sm">Supprimer ce thème ?</p>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">{{ message.message }}</p>
      <div class="mt-4 flex items-center justify-end gap-2">
        <p-button
          label="Annuler"
          size="small"
          severity="secondary"
          text
          (onClick)="confirmDeleteTheme.onReject()"
        />
        <p-button
          label="Supprimer"
          size="small"
          severity="danger"
          (onClick)="confirmDeleteTheme.onAccept()"
        />
      </div>
    </div>
  </ng-template>
</p-confirmpopup>
