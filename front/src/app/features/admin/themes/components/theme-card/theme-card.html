<p-card styleClass="border border-surface-200 dark:border-surface-700/80 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200" [style]="{ '--p-card-body-padding': '1rem' }">
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 shadow-sm border border-indigo-200 dark:border-indigo-800">
        <quizz-icon name="theme" />
      </div>
      <span class="text-base font-bold text-slate-900 dark:text-white">{{ theme().name }}</span>
    </div>

    @if (editable()) {
      <p-button
        severity="secondary"
        text
        rounded
        title="Changer le nom du thème"
        size="small"
        (onClick)="onOpenEditor()"
      >
        <quizz-icon name="pencil" pButtonIcon />
      </p-button>
      <quizz-theme-editor [theme]="theme()" [(visible)]="editorIsVisible" />
    }
  </div>
</p-card>
