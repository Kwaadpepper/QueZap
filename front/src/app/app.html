<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[9999] focus:px-4 focus:py-2.5 focus:bg-indigo-700 focus:text-white focus:rounded-xl focus:shadow-2xl focus:font-bold focus:outline-2 focus:outline-white"
>
  Aller au contenu principal
</a>

@if (layout.asWebsite()) {
  <header
    class="website-header flex justify-between pt-4"
    [class.admin-header]="onAdminPath()"
    [class.hide-header-on-scroll]="hideHeaderOnScroll()"
  >
    <a pButton class="m-2 mb-4" routerLink="/" title="Aller sur l'accueil" aria-label="Accueil QueZap" text outlined>
      <p-image src="images/quezap.svg" class="min-w-20" width="100" alt="QueZap"></p-image>
    </a>

    <div class="hidden grow md:flex md:items-center md:justify-end">
      @if (onAdminPath()) {
        <quizz-admin-nav />
      } @else {
        <quizz-site-nav />
      }
    </div>

    <div class="flex">
      @if (isLoggedIn()) {
        <quizz-logout-button class="mx-2 my-2 hidden md:inline-flex" />
      }
      <p-button
        class="ms-2 me-4 mt-1 md:hidden"
        title="Afficher le menu"
        ariaLabel="Afficher le menu de navigation"
        outlined
        severity="contrast"
        (onClick)="toggleDrawer()"
      >
        <quizz-icon name="bars" />
      </p-button>
    </div>
  </header>
}

<p-drawer
  position="right"
  styleClass="!w-60"
  [header]="onAdminPath() ? 'Administration' : 'Menu'"
  [(visible)]="drawerVisible"
>
  @if (onAdminPath()) {
    <quizz-admin-nav />
  } @else {
    <quizz-site-nav />
  }
  @if (isLoggedIn()) {
    <div class="flex justify-center">
      <quizz-logout-button class="mx-2" />
    </div>
  }
</p-drawer>

<quizz-loading-bar class="pointer-events-none absolute top-0 left-0 z-50 w-full" />
<main
  id="main-content"
  tabindex="-1"
  class="grow outline-hidden"
  pFocusTrap
  [pFocusTrapDisabled]="asWebsite()"
  [class]="{
    'main-as-website': asWebsite(),
    'main-in-container': inContainer(),
  }"
>
  <quizz-debugbar />
  <router-outlet />

  <p-toast
    position="bottom-left"
    [breakpoints]="{ '920px': { width: '100%', right: '0', left: '0' } }"
  />

  <quizz-scroll-top [showButton]="showScrollTopButton()" (clicked)="onScrollTopClick()" />
</main>

@if (asWebsite()) {
  <footer class="py-4 pt-5">
    <p-divider class="mx-auto w-full md:w-10/12" />
    <quizz-footer />
  </footer>
}
