limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=session_code_limit:10m rate=30r/m;

server {
    listen 8080;
    server_name localhost;
    server_tokens off;

    # Allow multipart uploads up to 10 MB (Spring Boot multipart limit) with margin for headers/form-data
    client_max_body_size 15M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static and dynamic assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2
        application/wasm;

    # Security headers (also re-included in every location block that sets add_header)
    include /etc/nginx/includes/security-headers.conf;

    # Service Worker & PWA Manifest: never cache to ensure immediate updates
    location ~* (ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest)$ {
        expires -1;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # Runtime frontend configuration generated at container startup: never cache
    location = /config.json {
        expires -1;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Hashed JS and CSS application bundles: Cache forever (immutable)
    location ~* \.(?:css|js)$ {
        expires 1y;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Media, images, subsetted fonts: long cache with stale-while-revalidate
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
        try_files $uri =404;
    }

    # Angular SPA routes: index.html fallback with no-cache policy
    location / {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Rate-limited authentication endpoints (backed by strict LoginRateLimiter on credentials)
    location ^~ /apiv1/auth/ {
        limit_req zone=auth_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/apiv1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limited session join code lookup endpoint
    location ^~ /apiv1/sessions/by-code/ {
        limit_req zone=session_code_limit burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/apiv1/sessions/by-code/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API and SSE traffic to backend
    location ^~ /apiv1/ {
        proxy_pass http://backend:8080/apiv1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (Server-Sent Events) live stream streaming support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy public pictures stored in RustFS (S3)
    location ^~ /quezap-public-images/ {
        limit_except GET HEAD {
            deny all;
        }

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        proxy_pass http://rustfs:9000/quezap-public-images/;
        proxy_http_version 1.1;
        proxy_set_header Host rustfs:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
