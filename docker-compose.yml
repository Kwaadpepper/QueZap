services:
  postgres:
    image: postgres:17-alpine
    container_name: quezap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quezap
      POSTGRES_USER: quezap
      POSTGRES_PASSWORD: quezap_password
    ports:
      - "5432:5432"
    volumes:
      - quezap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quezap -d quezap"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: quezap-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quezap_java_writer
      MINIO_ROOT_PASSWORD: LocalPassword
    ports:
      - "9190:9000"
      - "9191:9001"
    volumes:
      - quezap_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: quezap-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      /usr/bin/mc alias set myminio http://minio:9000 quezap_java_writer LocalPassword;
      /usr/bin/mc mb myminio/quezap-public-images || true;
      /usr/bin/mc anonymous set download myminio/quezap-public-images || true;
      exit 0;
      "

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: quezap-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_DB_URL: jdbc:postgresql://postgres:5432/quezap
      APP_DB_USERNAME: quezap
      APP_DB_PASSWORD: quezap_password
      APP_S3_HOST: minio
      APP_S3_PORT: 9000
      APP_S3_PUBLIC_ENDPOINT: http://localhost:9190
      APP_S3_BUCKET_NAME: quezap-public-images
      APP_S3_ACCESS_KEY_ID: quezap_java_writer
      APP_S3_SECRET_ACCESS_KEY: LocalPassword
      APP_JWT_SECRET_KEY: 4a3c4e58311739e4a396ad7a38a5454ad65cfde67b0fef9aeb351cbb3c478fef
      APP_JWT_ISSUER: quezap.com
    ports:
      - "8080:8080"

  cli:
    build:
      context: ./back
      dockerfile: Dockerfile
      target: builder
    container_name: quezap-cli
    profiles:
      - cli
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_DB_URL: jdbc:postgresql://postgres:5432/quezap
      APP_DB_USERNAME: quezap
      APP_DB_PASSWORD: quezap_password
      APP_S3_HOST: minio
      APP_S3_PORT: 9000
      APP_S3_PUBLIC_ENDPOINT: http://localhost:9190
      APP_S3_BUCKET_NAME: quezap-public-images
      APP_S3_ACCESS_KEY_ID: quezap_java_writer
      APP_S3_SECRET_ACCESS_KEY: LocalPassword
      APP_JWT_SECRET_KEY: 4a3c4e58311739e4a396ad7a38a5454ad65cfde67b0fef9aeb351cbb3c478fef
      APP_JWT_ISSUER: quezap.com
    stdin_open: true
    tty: true
    command: ["./gradlew", ":quezap-cli:bootRun", "--console=plain"]

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: quezap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8000:80"

volumes:
  quezap_postgres_data:
  quezap_minio_data:
