# ==============================================================================
# QueZap - Docker Compose Production (GraalVM Native + RustFS + Persistance)
# ==============================================================================
# Prérequis avant le premier lancement :
#   cp .env.example .env
#   # Éditer .env (mots de passe, APP_JWT_SECRET_KEY, APP_PUBLIC_URL)
#   docker compose up -d --build
# ==============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    container_name: quezap-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quezap}
      POSTGRES_USER: ${POSTGRES_USER:-quezap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    volumes:
      - quezap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quezap} -d ${POSTGRES_DB:-quezap}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quezap-net

  rustfs-perms:
    image: alpine:3.21
    container_name: quezap-rustfs-perms
    user: "0:0"
    volumes:
      - quezap_rustfs_data:/data
      - quezap_rustfs_logs:/logs
    command: ["sh", "-c", "mkdir -p /data /logs && chown -R 10001:10001 /data /logs"]
    networks:
      - quezap-net

  rustfs:
    image: rustfs/rustfs:latest
    container_name: quezap-rustfs
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: ${RUSTFS_CONSOLE_ENABLE:-false}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY doit être défini dans .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY doit être défini dans .env}
      RUSTFS_VOLUMES: "/data"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
    expose:
      - "9000"
      - "9001"
    volumes:
      - quezap_rustfs_data:/data
      - quezap_rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - quezap-net

  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: quezap-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY doit être défini dans .env}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY doit être défini dans .env}
      AWS_DEFAULT_REGION: "us-east-1"
      APP_S3_BUCKET_NAME: ${APP_S3_BUCKET_NAME:-quezap-public-images}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo "En attente de RustFS..."
          sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3 mb "s3://$${APP_S3_BUCKET_NAME}" 2>/dev/null || true
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-policy \
          --bucket "$${APP_S3_BUCKET_NAME}" \
          --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicRead\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$${APP_S3_BUCKET_NAME}/*\"]}]}"
        echo "Bucket $${APP_S3_BUCKET_NAME} prêt (lecture publique activée)."
    networks:
      - quezap-net

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.native
    container_name: quezap-backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quezap}
      APP_DB_USERNAME: ${POSTGRES_USER:-quezap}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      APP_S3_HOST: rustfs
      APP_S3_PORT: 9000
      APP_S3_PUBLIC_ENDPOINT: ${APP_PUBLIC_URL:-http://localhost:8000}
      APP_S3_BUCKET_NAME: ${APP_S3_BUCKET_NAME:-quezap-public-images}
      APP_S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY doit être défini dans .env}
      APP_S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY doit être défini dans .env}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:?APP_JWT_SECRET_KEY doit être défini dans .env}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-quezap.fr}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quezap-net

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: quezap-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"
    networks:
      - quezap-net

  cli:
    build:
      context: ./back
      dockerfile: Dockerfile
      target: builder
    container_name: quezap-cli
    profiles:
      - cli
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      APP_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-quezap}
      APP_DB_USERNAME: ${POSTGRES_USER:-quezap}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      APP_S3_HOST: rustfs
      APP_S3_PORT: 9000
      APP_S3_PUBLIC_ENDPOINT: ${APP_PUBLIC_URL:-http://localhost:8000}
      APP_S3_BUCKET_NAME: ${APP_S3_BUCKET_NAME:-quezap-public-images}
      APP_S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY doit être défini dans .env}
      APP_S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY doit être défini dans .env}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:?APP_JWT_SECRET_KEY doit être défini dans .env}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-quezap.fr}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    stdin_open: true
    tty: true
    command: ["./gradlew", ":quezap-cli:bootRun", "--console=plain"]
    networks:
      - quezap-net

  seed:
    image: curlimages/curl:latest
    container_name: quezap-seed
    profiles:
      - seed
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./seed.sh:/seed.sh:ro
    environment:
      BASE_URL: http://backend:8080/apiv1
      FRONT_PORT: "${APP_PORT:-8000}"
    entrypoint: ["/bin/sh", "/seed.sh"]
    networks:
      - quezap-net

networks:
  quezap-net:
    driver: bridge
    name: quezap-net

volumes:
  quezap_postgres_data:
    name: quezap_postgres_data
  quezap_rustfs_data:
    name: quezap_rustfs_data
  quezap_rustfs_logs:
    name: quezap_rustfs_logs
