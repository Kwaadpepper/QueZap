debug: false

server:
  port: 8080

spring:
  application:
    name: quizz
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${APP_DB_URL:jdbc:postgresql://localhost:5432/quezap}
    username: ${APP_DB_USERNAME:quezap}
    password: ${APP_DB_PASSWORD:quezap_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  shell:
    interactive:
      enabled: false
    script:
      enabled: false
    history:
      enabled: false
      name:
  output:
    ansi:
      enabled: ALWAYS
  mail:
    host: ${APP_MAIL_HOST:localhost}
    port: ${APP_MAIL_PORT:1025}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${APP_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${APP_MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

logging:
  level:
    root: INFO
    '[software.amazon.awssdk]': INFO
    '[org.apache.http]': INFO

profanity:
  custom-words: badword1,badword2

session-code:
  seed: 12345
  length: 6
  dictionary: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"

pictures-s3:
  host: ${APP_S3_HOST:localhost}
  port: ${APP_S3_PORT:9190}
  public-endpoint: ${APP_S3_PUBLIC_ENDPOINT:http://localhost:9190}
  bucket-name: ${APP_S3_BUCKET_NAME:quezap-public-images}
  access-key-id: ${APP_S3_ACCESS_KEY_ID:quezap_java_writer}
  secret-access-key: ${APP_S3_SECRET_ACCESS_KEY:LocalPassword}

jwt:
  signing-key: ${APP_JWT_SECRET_KEY:4a3c4e58311739e4a396ad7a38a5454ad65cfde67b0fef9aeb351cbb3c478fef}
  issuer: ${APP_JWT_ISSUER:quezap.com}

participation:
  token-expiration-seconds: 3600

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:8000}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@quezap.fr}
    app-name: ${APP_NAME:QueZap}
  turnstile:
    secret-key: ${APP_TURNSTILE_SECRET_KEY:}
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  security:
    identifier-pepper: ${APP_IDENTIFIER_PEPPER:7d9e3b1f4c8a2e6d5b0f9a1c3e7d2b4f6a8c0e1d3b5f7a9c2e4d6f8a0b1c3e5d}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}

management:
  health:
    mail:
      enabled: false
